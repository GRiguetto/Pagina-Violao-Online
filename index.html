<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólio</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath d='M4 0v8' stroke='%23c8913a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Six+Caps&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.tema=localStorage.tema||(matchMedia('(prefers-color-scheme:dark)').matches?'escuro':'claro')}catch(e){}</script>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<a class="pular" href="#sobre">Pular para o conteúdo</a>
<header class="topo">
  <a class="marca" href="#inicio" aria-label="Voltar ao início"></a>
  <nav aria-label="Principal">
    <a href="#sobre">Sobre</a><a href="#projetos">Projetos</a><a href="#stack">Stack</a><a href="#percurso">Percurso</a><a href="#contato">Contato</a>
    <button id="tema" class="claro" type="button" aria-label="Alternar entre tema claro e escuro">Tema</button>
  </nav>
</header>
<main>
  <section class="hero" id="inicio" aria-label="Apresentação">
    <div class="hero-txt">
      <h1 id="nome"></h1>
      <p id="titulo"></p>
      <div class="acoes"><a class="btn" href="#projetos">Ver projetos</a><a href="#contato">Falar comigo</a></div>
    </div>
    <div class="braco" id="braco">
      <canvas aria-hidden="true"></canvas>
      <div class="pegs" role="group" aria-label="Cordas do violão"></div>
      <div class="leitor">
        <span class="nota" aria-hidden="true">—</span>
        <div class="info"><span class="nome-nota">Toque uma corda</span><div class="medidor" aria-hidden="true"><i></i></div></div>
        <div class="acoes"><button class="claro" id="dedilhar" type="button">Dedilhar</button><button class="claro" id="som" type="button">Som desligado</button></div>
        <p class="dica">Passe o cursor ou deslize o dedo sobre as cordas. As teclas 1 a 6 também tocam.</p>
      </div>
      <p class="sr" id="fala" aria-live="polite"></p>
    </div>
  </section>
  <div id="conteudo"></div>
</main>
<footer class="rodape"><p>Feito à mão com HTML, CSS e JavaScript puros, sem framework e sem etapa de build.</p></footer>
<dialog id="det" aria-label="Detalhes do projeto"><article></article><form method="dialog"><button class="btn">Fechar</button></form></dialog>
<p id="aviso" role="status"></p>
<aside id="ed" hidden><p></p><button class="btn" type="button">Entendi</button></aside>
<noscript><p style="padding:2rem">Este portfólio precisa de JavaScript para exibir o conteúdo.</p></noscript>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/instrumento.js"></script>
</body>
</html>
